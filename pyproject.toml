[project]
name = "practica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ovidio-Hernandez", email = "321465083+Ovidio-Hernandez@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.13.4",
]

[project.scripts]
practica = "practica:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
